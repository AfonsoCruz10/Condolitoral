name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "my-app/**"
      - ".github/workflows/depoly.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        working-directory: ./my-app
        run: npm ci

      - name: Build the project
        working-directory: ./my-app
        env:
          REACT_APP_EMAILJS_SERVICE_ID: ${{ secrets.REACT_APP_EMAILJS_SERVICE_ID }}
          REACT_APP_EMAILJS_TEMPLATE_ID_PEDIDO_ORCAMENTO: ${{ secrets.REACT_APP_EMAILJS_TEMPLATE_ID_PEDIDO_ORCAMENTO }}
          REACT_APP_EMAILJS_TEMPLATE_ID_CONTACT: ${{ secrets.REACT_APP_EMAILJS_TEMPLATE_ID_CONTACT }}
          REACT_APP_EMAILJS_PUBLIC_KEY: ${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./my-app/build
          publish_branch: gh-pages
          force_orphan: true
          cname: condolitoral.pt
