name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # Evita conflitos com GITHUB_TOKEN

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./my-app
        run: npm install

      - name: Build the project
        working-directory: ./my-app
        env:
          REACT_APP_EMAILJS_SERVICE_ID: ${{ secrets.REACT_APP_EMAILJS_SERVICE_ID }}
          REACT_APP_EMAILJS_TEMPLATE_ID_PEDIDO_ORCAMENTO: ${{ secrets.REACT_APP_EMAILJS_TEMPLATE_ID_PEDIDO_ORCAMENTO }}
          REACT_APP_EMAILJS_TEMPLATE_ID_CONTACT: ${{ secrets.REACT_APP_EMAILJS_TEMPLATE_ID_CONTACT }}
          REACT_APP_EMAILJS_PUBLIC_KEY: ${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: ./my-app/build
          publish_branch: gh-pages  # Garante que o push seja para a branch correta
          force_orphan: true  # Garante que os arquivos antigos não causem conflitos
